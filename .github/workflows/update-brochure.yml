name: Обнови брошурата на Лидл

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Линк към PDF на брошурата (от lidl.bg → Брошури → Изтегли PDF)"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - name: Свали и парсни
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          curl -fsSL -A "Mozilla/5.0" -o /tmp/brochure.pdf "$PDF_URL"
          python scripts/parse_brochure.py /tmp/brochure.pdf data/offers.json
          python - <<'PY'
          import json, os
          p = "data/offers.json"; d = json.load(open(p, encoding="utf-8"))
          d["source"] = os.environ["PDF_URL"].rsplit("/", 1)[-1]
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(d["count"], "оферти")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/offers.json
          git commit -m "Брошура: ${{ inputs.pdf_url }}" || echo "Няма промени"
          git push
